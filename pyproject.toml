[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-teamcity"
version = "0.1.1"
description = "Google Antigravity SDK runner for TeamCity CI/CD build agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "google-antigravity==0.1.24",
    "google-genai==3.6.1",
    "google-auth==2.63.1",
    "mcp==2.3.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "requests==2.34.2",
    "uvicorn==0.54.0",
    "starlette==1.10.0",
    "sse-starlette==3.7.1",
    "websockets==17.4",
    "typing-extensions==4.16.0",
]

[project.scripts]
antigravity-teamcity = "prompt:main_cli"

[tool.setuptools]
py-modules = ["prompt"]
