[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-teamcity"
version = "0.1.0"
description = "Google Antigravity SDK runner for TeamCity CI/CD build agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "google-antigravity==0.1.15",
    "google-genai==2.20.0",
    "google-auth==2.57.0",
    "mcp==1.29.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "requests==2.34.2",
    "uvicorn==0.52.4",
    "starlette==1.6.0",
    "sse-starlette==3.4.8",
    "websockets==16.1.1",
    "typing-extensions==4.16.0",
]

[project.scripts]
antigravity-teamcity = "prompt:main_cli"

[tool.setuptools]
py-modules = ["prompt"]
